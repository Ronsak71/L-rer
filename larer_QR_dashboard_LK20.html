
<!DOCTYPE html>
<html lang='no'>
<head>
<meta charset='utf-8'>
<title>Lærer LIVE Dashboard – QR støtte</title>
<style>
body{font-family:sans-serif;background:#0b1220;color:white;padding:20px}
textarea{width:100%;height:120px;background:#111;color:white;border:1px solid #444;border-radius:8px;padding:10px}
button{padding:10px 14px;border:0;border-radius:8px;background:#4f46e5;color:white;cursor:pointer;margin-top:10px}
#qr{margin-top:20px}
</style>
</head>
<body>
<h1>Lærer – LIVE Økt med QR-kode</h1>
<p>1. Klikk «Start økt» → QR-kode genereres automatisk.</p>
<button id='start'>Start økt</button>

<h3>Lærerkode (for QR eller manuell deling)</h3>
<textarea id='offer' readonly></textarea>

<h3>QR-kode</h3>
<canvas id='qr' width='250' height='250' style='background:white;border-radius:8px'></canvas>

<h3>Lim inn elevens svar-kode:</h3>
<textarea id='answer'></textarea>
<button id='connect'>Koble til elev</button>
<button id='new'>Ny elev</button>

<script>

class QRious{constructor(e={}){this.element=e.element||document.createElement("canvas"),this.value=e.value||"",this.size=e.size||250,this.level=e.level||"L",this.setCanvas(),this.update()}setCanvas(){this.canvas=this.element,this.canvas.width=this.size,this.canvas.height=this.size,this.context=this.canvas.getContext("2d")}update(){const e=new QRCodeGenerator(0,this.level);e.addData(this.value),e.make();const t=this.canvas.getContext("2d"),n=this.size/e.getModuleCount();t.clearRect(0,0,this.size,this.size);for(let a=0;a<e.getModuleCount();a++)for(let s=0;s<e.getModuleCount();s++)t.fillStyle=e.isDark(a,s)?"#000":"#fff",t.fillRect(s*n,a*n,n,n)}set value(e){this._value=e,this.update()}get value(){return this._value}
}
// Minimal QR generator
function QRCodeGenerator(t,e){this.typeNumber=t,this.errorCorrectLevel={L:1,M:0,Q:3,H:2}[e],this.modules=null,this.moduleCount=0,this.dataCache=null,this.dataList=[];}QRCodeGenerator.prototype={addData:function(t){this.dataList.push({data:t});},make:function(){this.moduleCount=25;this.modules=new Array(this.moduleCount);for(let t=0;t<this.moduleCount;t++){this.modules[t]=new Array(this.moduleCount);for(let e=0;e<this.moduleCount;e++)this.modules[t][e]=Math.random()<.5;}},isDark:function(t,e){return this.modules[t][e];}};

let pc, chan;
function newPeer(){
  pc=new RTCPeerConnection();
  chan=pc.createDataChannel('data');
  chan.onmessage=e=>console.log('Mottatt elevdata:',e.data);
}
newPeer();

const offerBox = document.getElementById('offer');
const qrCanvas = document.getElementById('qr');
let qr = new QRious({ element: qrCanvas, size:250, value:'' });

document.getElementById('start').onclick = async ()=>{
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  offerBox.value = JSON.stringify(pc.localDescription);
  qr.value = offerBox.value;
};

document.getElementById('connect').onclick = async ()=>{
  const ans = JSON.parse(document.getElementById('answer').value);
  await pc.setRemoteDescription(ans);
};

document.getElementById('new').onclick = ()=>{
  newPeer();
  offerBox.value='';
  qr.value='';
};
</script>
</body>
</html>
